name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  demo-scan:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Start vulnerable demo app
        run: |
          uvicorn demo.vulnerable_app.app:app --port 8765 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8765/ && break; sleep 0.5; done
      - name: Scan demo app (expected to find vulnerabilities)
        run: llmprobe scan -c examples/demo.yaml -o reports
      - uses: actions/upload-artifact@v4
        with:
          name: llmprobe-demo-report
          path: reports/
